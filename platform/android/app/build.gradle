plugins { id 'com.android.application' }

android {
    namespace 'com.exworld.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.exworld.game'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        ndkVersion '27.2.12479018'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DEXGINE_BUILD_DEMO=OFF',
                          '-DEXGINE_BUILD_TESTS=OFF',
                          '-DEXWORLD_ANDROID=ON'
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            debuggable false
        }
    }

    sourceSets {
        main {
            // Ship game content as Android assets
            assets.srcDirs = ['../../../content']
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
