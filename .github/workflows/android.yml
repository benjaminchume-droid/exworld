name: EXWORLD Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout EXWORLD
        uses: actions/checkout@v4
        with:
          path: exworld

      - name: Checkout EXGINE
        uses: actions/checkout@v4
        with:
          repository: benjaminchume-droid/exgine
          path: exgine

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same pattern as the working EXGINE android.yml
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          which sdkmanager || true
          sdkmanager --list_installed || true

          # Accept licenses non-interactively
          yes | sdkmanager --licenses >/tmp/sdk-licenses.log 2>&1 || true

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          # Resolve SDK root for later steps
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            # setup-android usually exports ANDROID_HOME; fallback common path
            if [ -d "$HOME/Android/Sdk" ]; then
              SDK_ROOT="$HOME/Android/Sdk"
            elif [ -d "/usr/local/lib/android/sdk" ]; then
              SDK_ROOT="/usr/local/lib/android/sdk"
            fi
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT"

          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          test -d "$NDK_DIR"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "EXGINE_ROOT=${{ github.workspace }}/exgine" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Write local.properties
        working-directory: exworld/platform/android
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          cat local.properties
          test -f "${{ github.workspace }}/exgine/CMakeLists.txt"

      - name: Build debug APK
        working-directory: exworld/platform/android
        env:
          EXGINE_ROOT: ${{ github.workspace }}/exgine
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "EXGINE_ROOT=$EXGINE_ROOT"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_NDK_HOME"
          test -f "$EXGINE_ROOT/CMakeLists.txt"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Locate APK
        working-directory: exworld/platform/android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "No debug APK found"
            find app/build -type f \( -name '*.apk' -o -name '*.so' \) 2>/dev/null | head -80 || true
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exworld-android-debug
          path: exworld/platform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
