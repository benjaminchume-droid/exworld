name: EXWORLD Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout EXWORLD
        uses: actions/checkout@v4
        with:
          path: exworld

      - name: Checkout EXGINE
        uses: actions/checkout@v4
        with:
          repository: benjaminchume-droid/exgine
          path: exgine

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.log 2>&1 || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            [ -d "$HOME/Android/Sdk" ] && SDK_ROOT="$HOME/Android/Sdk"
            [ -d "/usr/local/lib/android/sdk" ] && SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          test -d "$SDK_ROOT"
          test -d "$NDK_DIR"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "EXGINE_ROOT=${{ github.workspace }}/exgine" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Write local.properties
        working-directory: exworld/platform/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          cat local.properties

      - name: Build debug APK
        working-directory: exworld/platform/android
        env:
          EXGINE_ROOT: ${{ github.workspace }}/exgine
        run: |
          set -euo pipefail
          test -f "$EXGINE_ROOT/CMakeLists.txt"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify native libs inside APK
        working-directory: exworld/platform/android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          # Must contain native library
          grep -E 'lib/.*/libexworld_android\.so' /tmp/apk-list.txt
          # Must contain game content
          grep -E 'assets/project\.exg' /tmp/apk-list.txt
          # Report .so sizes
          unzip -l "$APK" | grep '\.so' || true
          SIZE=$(stat -c%s "$APK")
          echo "APK bytes=$SIZE"
          # Warn if absurdly small (< 500KB almost certainly missing native code)
          if [ "$SIZE" -lt 500000 ]; then
            echo "APK is suspiciously small — native link may have failed"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exworld-android-debug
          path: exworld/platform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
